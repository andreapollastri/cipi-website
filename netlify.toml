# Netlify — https://cipi.sh
# `/` is the English homepage (200). Edge routing lives in netlify/edge-functions/i18n.js
# Former language trees 301 to English. Do not language-redirect `/`.

[build]
  publish = "."
  # No build step — static site

[[edge_functions]]
  function = "i18n"
  path = "/*"

[[redirects]]
  from = "https://www.cipi.sh/*"
  to = "https://cipi.sh/:splat"
  status = 301
  force = true
