# Netlify — https://cipi.sh
# `/` is the English homepage (200). Pages live at the root (`/docs/`, `/whats-new`, …).
# Edge routing lives in netlify/edge-functions/i18n.js. `/en/…` 301s to the unprefixed URL.

[build]
  publish = "."
  # No build step — static site

[[edge_functions]]
  function = "i18n"
  path = "/*"

[[redirects]]
  from = "https://www.cipi.sh/*"
  to = "https://cipi.sh/:splat"
  status = 301
  force = true
